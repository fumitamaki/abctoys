{% extends "base.html" %}
{% block content %}
<section class="page-hero">
  <div class="container">
    <p class="eyebrow">Customer stories</p>
    <h1>Cases</h1>
    <p>導入事例風のページです。実在企業名や実在案件は含めていません。</p>
  </div>
</section>

<section class="container section image-highlight">
  <div class="content-card reveal">
    <div class="section-head">
      <div>
        <p class="eyebrow">Showroom image</p>
        <h2>店舗・ショールームのイメージ</h2>
      </div>
      <p>店頭・ショールーム・販促のイメージとして利用できるダミー画像です。</p>
    </div>
    <img src="{{ url_for('static', filename='img/toy-showroom.png') }}" alt="ABCトイズの店舗展示イメージ">
  </div>
</section>

<section class="container section case-list">
  {% for case in cases %}
  <article class="case-card reveal">
    <span class="tag">{{ case.tag }}</span>
    <h2>{{ case.name }}</h2>
    <p>{{ case.summary }}</p>
  </article>
  {% endfor %}
</section>
{% endblock %}
